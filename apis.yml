name: Octant Bio
description: >-
  Octant (Octant Bio) is a precision-medicine and therapeutics company based in
  Emeryville, California, founded by Sri Kosuri and Ramsey Homsany. Octant
  engineers small-molecule drugs that modulate cellular mechanisms behind serious
  disease, with a focus on protein misfolding and mistrafficking disorders. Its
  Navigator platform merges synthetic biology, massively parallel experimentation
  in human cells, high-throughput chemistry, and AI/ML to understand and modulate
  how target proteins actually behave inside cells. Programs span rare genetic
  diseases (including autosomal dominant retinitis pigmentosa and Fabry disease),
  oncology, metabolism, and immunology. Octant is backed by Andreessen Horowitz
  (a16z) and Catalio Capital Management. As of this profile Octant publishes no
  public developer API, SDK, or developer portal; this record captures the
  company's public web identity in the API Evangelist network.
